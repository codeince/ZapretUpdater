# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

env:
  NAME: ZapretUpdater

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    strategy:
      matrix:
        OS: [linux-x64, win-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Build ${{matrix.OS}} Contained
        run: dotnet publish -r ${{matrix.OS}} /p:PublishSingleFile=true
      - name: Rename self-contained file
        run: mv ./bin/Release/net10.0/${{matrix.OS}}/publish/${{env.NAME}}${{matrix.OS == 'win-x64' && '.exe' || ''}} ./bin/Release/net10.0/${{matrix.OS}}/publish/${{env.NAME}}-Contained${{matrix.OS == 'win-x64' && '.exe' || ''}}
      - name: Build ${{matrix.OS}}
        run: dotnet publish -r ${{matrix.OS}} --self-contained=false /p:PublishSingleFile=true
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{matrix.OS}}
          path: bin/Release/net10.0/${{matrix.OS}}/publish/${{env.NAME}}**

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(dotnet msbuild "${{env.NAME}}.csproj" \
            -getProperty:Version \
            -nologo \
            -v:q)

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true
          path: artifacts
      - name: Create GitHub Release
        run: |
          tag="${{steps.version.outputs.VERSION}}"
          if gh release view "$tag" >/dev/null 2>&1; then
              tag="${tag}.${{github.run_id}}"
          fi

          gh release create "$tag" artifacts/* --prerelease --generate-notes -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
